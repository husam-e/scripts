name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.15"
  NODE_VERSION: "26.13.0"
  RUFF_VERSION: "0.17.3"
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff
        run: pipx run "ruff==${RUFF_VERSION}" check repo-stats
      - name: ShellCheck
        run: shellcheck release_notes_generator.sh

  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: repo-stats
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Playwright + Chromium (for browser tests)
        run: |
          npm install --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Configure git (tests build synthetic repos)
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
