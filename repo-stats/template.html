<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repository stats</title>
<style>
:root {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;

  --good-text: #0ca30c;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --other: #898781;
  --st-good: #0ca30c; --st-warn: #fab219; --st-serious: #ec835a; --st-crit: #d03b3b;
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.05);
  --good-text: #006300;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1240px; margin: 0 auto; padding: 0 16px 64px; }
h1 { font-size: 22px; margin: 24px 0 2px; font-weight: 650; }
h2 { font-size: 17px; margin: 36px 0 10px; font-weight: 650; scroll-margin-top: 72px; }
h3 { font-size: 14px; margin: 0; font-weight: 650; }
p { margin: 4px 0; }
.sub { color: var(--ink2); }
.muted { color: var(--muted); }
header .sub { margin-top: 2px; }
nav.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 13px; }
nav.toc a { color: var(--ink2); text-decoration: none; }
nav.toc a:hover { color: var(--ink); text-decoration: underline; }

.filters { position: sticky; top: 0; z-index: 20; background: var(--page); border-bottom: 1px solid var(--border);
  padding: 10px 0; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.filters label { color: var(--ink2); font-size: 12px; display: flex; align-items: center; gap: 6px; }
select, input[type=date], button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 8px; }
button { cursor: pointer; }
button:hover, select:hover { background: var(--hover); }
button[aria-pressed="true"] { border-color: var(--ink2); font-weight: 600; }
:focus-visible { outline: 2px solid var(--c1); outline-offset: 1px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips button { padding: 2px 8px; font-size: 12px; border-radius: 999px; }
.chips button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.chips button[aria-pressed="false"] { opacity: .55; }

.banner { border: 1px solid var(--border); border-left: 4px solid var(--st-warn); background: var(--surface); border-radius: 8px;
  padding: 10px 14px; margin: 14px 0 0; }
.banner.ok { border-left-color: var(--st-good); }
.banner strong { font-weight: 650; }
.banner ul { margin: 6px 0 0; padding-left: 18px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.kpi .label { color: var(--ink2); font-size: 12px; }
.kpi .value { font-size: 26px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
.kpi .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
.band { display: inline-block; font-size: 11px; font-weight: 650; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); margin-left: 6px; vertical-align: middle; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 14px 10px; min-width: 0; }
.card.wide { grid-column: 1 / -1; }
.card-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.card-head .grow { flex: 1; }
.card-head button { font-size: 12px; padding: 1px 8px; }
.note { color: var(--ink2); font-size: 12px; margin: 0 0 6px; }
.badge { font-size: 11px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--st-warn); color: var(--ink2); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 4px 0 2px; font-size: 12px; color: var(--ink2); }
.legend span.key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend span.line { display: inline-block; width: 14px; height: 0; border-top: 2px solid; margin-right: 5px; vertical-align: 3px; }
.empty { color: var(--muted); padding: 28px 0; text-align: center; }
.chart { position: relative; }
svg text { fill: var(--muted); font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
svg .grid-line { stroke: var(--grid); stroke-width: 1; }
svg .axis-line { stroke: var(--axis); stroke-width: 1; }
svg .mark-label { fill: var(--ink2); }
svg .bar:hover { filter: brightness(1.12); }

table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 12.5px; }
th, td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 150px; }
th.title { text-align: left; }
th { color: var(--ink2); font-weight: 600; }
.tablewrap { overflow-x: auto; }
td.title { text-align: left; white-space: normal; min-width: 170px; max-width: 420px; overflow-wrap: break-word; }

#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--axis);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; max-width: 280px; }
#tip .t { color: var(--ink2); margin-bottom: 4px; }
#tip .r { display: flex; align-items: center; gap: 6px; line-height: 1.5; }
#tip .r .k { width: 12px; height: 0; border-top: 2px solid; flex: none; }
#tip .r b { font-weight: 650; margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; }
#tip .r span.n { color: var(--ink2); }
dl.method { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
dl.method dt { font-weight: 600; }
dl.method dd { margin: 0; color: var(--ink2); min-width: 0; overflow-wrap: anywhere; }
dl.method code { overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
svg .mark-label { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } dl.method { grid-template-columns: minmax(0, 1fr); } dl.method dd { margin-bottom: 6px; } }
@media (forced-colors: active) { svg .bar, svg path { forced-color-adjust: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Repository stats</h1>
    <div class="sub" id="subtitle"></div>
    <nav class="toc" aria-label="Sections">
      <a href="#overview">Overview</a><a href="#loc">Lines of code</a><a href="#throughput">PR volume</a><a href="#size">PR size</a>
      <a href="#types">PR types</a><a href="#risk">Risk</a><a href="#time">Time</a><a href="#reviews">Reviews</a><a href="#dora">DORA</a><a href="#method">Methodology</a>
    </nav>
  </header>
  <div class="filters" id="filters" role="group" aria-label="Filters"></div>
  <div id="banner"></div>
  <div id="app"></div>
</main>
<div id="tip" role="status"></div>
<script>

/* ------------------------------------------------------------------ stats */

/* ------------------------------------------------------------------ periods */

/* ------------------------------------------------------------------ state */
const PRS = DATA.prs, META = DATA.meta;

const groupOf = (t) => TYPE_GROUPS.includes(t) ? t : (GROUP_OF[t] || "other");

function renderLoc(app, sel) {
  sectionHead(app, "loc", "Lines of code over time", "Cumulative net lines (added minus deleted) on the first-parent history of the analysed branch, per day.");
  const grid = h("div", { class: "grid" });
  app.append(grid);
  const mode = { view: "total", code: false };
  const ctl = h("span", null);
  const c = card(grid, "Lines of code", { wide: true, controls: ctl, note: "Text files only; lockfiles, vendored and generated paths are excluded (see Methodology)." });
  const { days, langs, kinds } = DATA.loc;
  const draw = () => {
    c.body.replaceChildren();
    const idx = days.map((d, i) => i).filter((i) => days[i][0] >= sel.r.lo - DAY && days[i][0] <= sel.r.hi);
    const names = Object.keys(langs).filter((l) => !mode.code || kinds[l] === "code");
    const xs = idx.map((i) => days[i][0]);
    const total = idx.map((i) => mode.code ? sum(names.map((l) => langs[l][i])) : days[i][1]);
    if (mode.view === "total") {
      lineChart(c.body, { xs, series: [{ name: mode.code ? "Code lines" : "All text lines", color: css("--c1"), ys: total }], step: true, label: "Lines of code over time", table: c.table });
    } else {
      const ranked = names.slice().sort((a, b) => Math.max(...langs[b]) - Math.max(...langs[a]));
      const pal = SERIES();
      const keep = ranked.slice(0, 7), rest = ranked.slice(7);
      const sers = keep.map((l, k) => ({ name: l, color: pal[k], ys: idx.map((i) => langs[l][i]) }));
      if (rest.length) sers.push({ name: "Other", color: css("--other"), ys: idx.map((i) => sum(rest.map((l) => langs[l][i]))) });
      lineChart(c.body, { xs, series: sers.reverse(), stacked: true, label: "Lines of code by language", table: c.table });
    }
  };
  const seg = h("span", { class: "seg" }, [["total", "Total"], ["lang", "By language"]].map(([k, label]) =>
    h("button", { type: "button", "aria-pressed": String(mode.view === k), onclick: (e) => { mode.view = k; seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === e.currentTarget))); draw(); } }, label)));
  const codeBtn = h("button", { type: "button", "aria-pressed": "false", title: "Count only source code languages, not docs, data or config", onclick: (e) => { mode.code = !mode.code; e.currentTarget.setAttribute("aria-pressed", String(mode.code)); draw(); } }, "Code only");
  ctl.append(seg, " ", codeBtn);
  draw();

  const churn = card(grid, "Lines added and deleted per month", { wide: true, note: "Churn from all commits on the first-parent line. A merge counts when it lands." });
  const byMonth = new Map();
  for (const d of days) {
    if (d[0] < sel.r.lo - DAY || d[0] > sel.r.hi) continue;
    const m = bucketStart(d[0], "month"), e = byMonth.get(m) || [0, 0];
    e[0] += d[2]; e[1] += d[3]; byMonth.set(m, e);
  }
  const ms = [...byMonth.keys()].sort((a, b) => a - b);
  barChart(churn.body, { cats: ms.map((t) => ({ short: bucketLabel(t, "month"), long: bucketLabel(t, "month") })),
    series: [{ name: "Added", color: css("--c1"), vals: ms.map((t) => byMonth.get(t)[0]) }, { name: "Deleted", color: css("--c2"), vals: ms.map((t) => byMonth.get(t)[1]) }],
    label: "Lines added and deleted per month", catName: "Month", table: churn.table, tipFmt: fmtInt });
}

function renderThroughput(app, sel) {

  const grid = h("div", { class: "grid" });

  } else {

  }

  const sc = card(grid, "Merged PRs per period: statistics", { wide: true, note: "Complete periods only (partial first and last periods are dropped). Periods with no merges count as zero." });

const RISK_COLOR = { low: "--st-good", medium: "--st-warn", high: "--st-serious", critical: "--st-crit" };
function renderRisk(app, sel) {

  const counts = levels.map((l) => prs.filter((p) => p.risk_level === l).length);
  barChart(lc.body, { cats: levels, series: [{ name: "PRs", color: css("--c1"), vals: counts }], label: "PRs by risk level", table: lc.table, catName: "Level" });

  const mk = [...byM.keys()].sort((a, b) => a - b);
  lineChart(tc.body, { xs: mk, series: [{ name: "Mean score", color: css("--c1"), ys: mk.map((k) => stats(byM.get(k).map((p) => p.risk)).mean) },
    { name: "% high or critical", color: css("--c2"), ys: mk.map((k) => 100 * byM.get(k).filter((p) => p.risk_level === "high" || p.risk_level === "critical").length / byM.get(k).length) }],
    yFmt: (v) => String(Math.round(v)), tipFmt: fmtNum, xTip: (x) => bucketLabel(x, "month"), label: "Risk over time", table: tc.table });

  const fc = card(grid, "What drives the score", { note: "Share of PRs each rule applied to, and the mean points it added when it did." });
  const fac = new Map();
  prs.forEach((p) => p.risk_factors.forEach(([n, pts]) => { const e = fac.get(n) || [0, 0]; e[0]++; e[1] += pts; fac.set(n, e); }));
  fc.body.append(simpleTable(["Rule", "PRs", "Share", "Mean points"], [...fac.entries()].sort((a, b) => b[1][0] - a[1][0]).map(([n, [c, p]]) => [n, fmtInt(c), fmtPct(c / prs.length), fmtNum(p / c)])));

  const sc = card(grid, "Risk score statistics", { wide: true });

  const top = prs.slice().sort((a, b) => b.risk - a.risk || (b.lines || 0) - (a.lines || 0)).slice(0, 10);
  const tp = card(grid, "Ten highest-risk PRs", { wide: true });
  tp.body.append(h("div", { class: "tablewrap" }, h("table", null,
    h("thead", null, h("tr", null, ["PR", "Type", "Lines", "Files", "Score", "Why"].map((c) => h("th", { class: c === "Why" || c === "PR" ? "title" : null }, c)))),
    h("tbody", null, top.map((p) => h("tr", null, h("td", { class: "title" }, (p.number != null ? "#" + p.number + " " : "") + p.title), h("td", null, p.type), h("td", null, fmtInt(p.lines)), h("td", null, fmtInt(p.files)),
      h("td", null, String(p.risk) + " " + p.risk_level), h("td", { class: "title" }, p.risk_factors.map(([n, v]) => `${n} +${v}`).join(", "))))))));
}

  barChart(bc.body, { cats: B.map((b) => ({ short: b === top ? b + "+" : String(b), long: (b === top ? b + " or more" : String(b)) + (b === 1 ? " cycle" : " cycles") })),
    series: [{ name: "Unreviewed", color: css("--st-crit"), vals: B.map((b) => b === 0 ? cyc.unreviewed.length : 0) },
      { name: "Reviewed", color: css("--c1"), vals: B.map((b) => b === 0 ? 0 : cyc.reviewed.filter((p) => bucketOf(p.review_cycles) === b).length) }],
    stacked: true, label: "PRs by number of review cycles", table: bc.table, catName: "Review cycles" });

  const uc = card(grid, "Reviewed and unreviewed PRs by month", { note: "Merged PRs with review data, stacked." });
  const months = countBuckets([], "month", sel.r.lo, sel.r.hi).map((b) => b.t);
  barChart(uc.body, { cats: months.map((m) => ({ short: bucketLabel(m, "month"), long: bucketLabel(m, "month") })),
    series: [{ name: "Reviewed", color: css("--c1"), vals: months.map((m) => cyc.reviewed.filter((p) => bucketStart(p.merged, "month") === m).length) },
      { name: "Unreviewed", color: css("--st-crit"), vals: months.map((m) => cyc.unreviewed.filter((p) => bucketStart(p.merged, "month") === m).length) }],
    stacked: true, label: "Reviewed and unreviewed PRs by month", table: uc.table, catName: "Month" });

  const tc = card(grid, "Review cycles over time", { wide: true, note: "Median and p90 of reviewed PRs, and the mean with unreviewed PRs counted as 0, by month. Months with no reviewed PR are skipped." });
  const byM = groupBy(prs, (p) => bucketStart(p.merged, "month"));
  const mk = [...byM.keys()].filter((m) => byM.get(m).some((p) => p.review_cycles > 0)).sort((a, b) => a - b);
  const monthStats = (m) => cycleSplit(byM.get(m));
  lineChart(tc.body, { xs: mk, series: [{ name: "Median (reviewed)", color: css("--c1"), ys: mk.map((m) => monthStats(m).stReviewed.median) },
    { name: "p90 (reviewed)", color: css("--c2"), ys: mk.map((m) => monthStats(m).stReviewed.p90) },
    { name: "Mean (incl. unreviewed)", color: css("--c3"), ys: mk.map((m) => monthStats(m).stAll.mean) }],
    yFmt: fmtNum, tipFmt: fmtNum, xTip: (x) => bucketLabel(x, "month"), label: "Review cycles over time", table: tc.table });

  const SB = META.heuristics.size_buckets;
  const sc = card(grid, "Review cycles by PR size", { wide: true, note: SB.map(([lim, n], i) => lim == null ? `${n} > ${SB[i - 1][0]}` : `${n} ≤ ${lim}`).join(", ") + " lines changed." });
  const sizeOf = (v) => SB.find((b) => b[0] == null || v <= b[0])[1];
  const sized = groupBy(prs.filter((p) => p.lines != null), (p) => sizeOf(p.lines));
  sc.body.append(h("div", { class: "tablewrap" }, simpleTable(["Size", "PRs", "Median cycles (reviewed)", "p90 cycles (reviewed)", "Mean cycles (incl. unreviewed)", "Unreviewed", "Unreviewed share"],
    SB.map((b) => b[1]).filter((n) => sized.has(n)).map((n) => {
      const s2 = cycleSplit(sized.get(n));
      return [n, fmtInt(s2.known.length), fmtNum(s2.stReviewed.median), fmtNum(s2.stReviewed.p90), fmtNum(s2.stAll.mean), fmtInt(s2.unreviewed.length), fmtPct(s2.unreviewed.length / s2.known.length)];
    }))));

  const most = cyc.reviewed.slice().sort((a, b) => b.review_cycles - a.review_cycles || (b.changes_requested || 0) - (a.changes_requested || 0) || (b.lines || 0) - (a.lines || 0)).slice(0, 10);
  const mc = card(grid, "Ten PRs with the most review cycles", { wide: true });
  if (!most.length) mc.body.append(h("div", { class: "empty" }, "No reviewed PRs in this range."));
  else mc.body.append(h("div", { class: "tablewrap" }, h("table", null,
    h("thead", null, h("tr", null, ["PR", "Type", "Lines", "Review cycles", "Changes requested", "Reviewers"].map((c) => h("th", { class: c === "PR" ? "title" : null }, c)))),
    h("tbody", null, most.map((p) => h("tr", null, h("td", { class: "title" }, (p.number != null ? "#" + p.number + " " : "") + p.title), h("td", null, p.type), h("td", null, fmtInt(p.lines)),
      h("td", null, fmtInt(p.review_cycles) + (p.inferred.includes("review_cycles") ? "+" : "")), h("td", null, fmtInt(p.changes_requested)), h("td", null, fmtInt(p.reviewers))))))));
}

function renderDora(app, sel) {
  sectionHead(app, "dora", "DORA metrics", "Deployment frequency, lead time for changes, change failure rate and time to restore. Definitions are approximations; see Methodology.");
  const grid = h("div", { class: "grid" });
  app.append(grid);
  const { r, merged, deploys } = sel;
  const kind = state.period;
  const dc = card(grid, `Deployments per ${kind}`, { wide: true, note: META.deploy_source === "tags" ? `A deployment is a release tag matching ${TAG_DESC()}. Highlighted periods contain a release that shipped a revert or hotfix.` : "A deployment is any merge to the branch." });
  const times = (META.deploy_source === "tags" ? deploys.map((d) => d.t) : merged.map((p) => p.merged));
  const b = countBuckets(times, kind, r.lo, r.hi);
  const fix = countBuckets(deploys.filter((d) => d.fix).map((d) => d.t), kind, r.lo, r.hi);
  if (!times.length) dc.body.append(h("div", { class: "empty" }, "No deployments found. Adjust --tag-pattern or use --deploy-source merges."));
  else barChart(dc.body, { cats: b.map((x) => ({ short: kind === "month" ? bucketLabel(x.t, kind) : MONTHS[new Date(x.t * 1000).getUTCMonth()] + " " + new Date(x.t * 1000).getUTCDate(), long: bucketLabel(x.t, kind) })),
    series: [{ name: "Deployments", color: css("--c1"), vals: b.map((x, i) => x.v - fix[i].v) }, ...(sum(fix.map((x) => x.v)) ? [{ name: "Revert or hotfix releases", color: css("--c8"), vals: fix.map((x) => x.v) }] : [])], stacked: true, label: "Deployments per period", catName: "Period", table: dc.table });

  const fc = card(grid, "Deployment frequency statistics", { wide: true });
  const rows = ["day", "week", "month"].map((k) => {
    let x = countBuckets(times, k, r.lo, r.hi);
    if (k !== "day" && x.length > 2) { if (x[0].t < r.lo) x = x.slice(1); if (x.length && nextBucket(x[x.length - 1].t, k) - 1 > r.hi) x = x.slice(0, -1); }
    return { label: `per ${k}`, st: stats(x.map((v) => v.v)), fmt: fmtNum };
  });
  fc.body.append(statsTable(rows));
  const perDay = times.length / Math.max(1, (r.hi - r.lo) / DAY);
  fc.body.append(h("p", { class: "note" }, `Average ${fmtNum(perDay * 7)} per week.`, bandEl(times.length ? band("freq", perDay) : null)));

  const lc = card(grid, "Lead time for changes", { wide: true });
  const lm = leadMode(merged);
  const lt = stats(merged.map((p) => p[lm.key]));
  lc.body.append(statsTable([{ label: lm.release ? "First commit to release" : "First commit to merge", st: lt, fmt: fmtDur }]));
  const unreleased = lm.release ? merged.filter((p) => p.lead_to_deploy == null).length : 0;
  lc.body.append(h("p", { class: "note" }, lm.release ? `Measured to the first release tag that contains the change${unreleased ? `; ${unreleased} merged PR(s) not yet released are left out` : ""}. The overview card and the by-type table use the same definition.` : "No merged PR in this range has a release, so this stops at merge time.", bandEl(band("lead", lt.median))));

  const cf = card(grid, "Change failure rate", { wide: true, note: "Revert or hotfix PRs as a share of merged PRs, by month." });
  const byM = groupBy(merged, (p) => bucketStart(p.merged, "month"));
  const mk = [...byM.keys()].sort((a, b) => a - b);
  const fails = merged.filter((p) => p.kind);
  lineChart(cf.body, { xs: mk, series: [{ name: "Failure rate", color: css("--c8"), ys: mk.map((m) => 100 * byM.get(m).filter((p) => p.kind).length / byM.get(m).length) }], yFmt: (v) => Math.round(v) + "%", tipFmt: (v) => nf.format(v) + "%", xTip: (x) => bucketLabel(x, "month"), label: "Change failure rate by month", table: cf.table, h: 200 });
  cf.body.append(h("p", { class: "note" }, `${fails.length} of ${merged.length} merged PRs (${fmtPct(merged.length ? fails.length / merged.length : null)}): ${fails.filter((p) => p.kind === "revert").length} reverts, ${fails.filter((p) => p.kind === "hotfix").length} hotfixes.` + (deploys.length ? ` ${deploys.filter((d) => d.fix).length} of ${deploys.length} releases contain one.` : ""), bandEl(merged.length ? band("cfr", fails.length / merged.length) : null)));

  const rc = card(grid, "Time to restore", { wide: true });
  const rs = stats(merged.map((p) => p.restore));
  if (rs.n) {
    rc.body.append(statsTable([{ label: "Revert merged after the change it reverts", st: rs, fmt: fmtDur }]));
    rc.body.append(h("p", { class: "note" }, `Based on ${rs.n} revert commits that name the change they undo. Hotfixes cannot be matched to a failure from git, so they are not included.`, bandEl(band("restore", rs.median))));
  } else rc.body.append(h("div", { class: "empty" }, "No reverts that reference the commit they undo were found."));
}

function renderMethod(app) {
  const R = META.heuristics.risk;
  app.append(h("h2", { id: "method" }, "Methodology and data quality"));
  const grid = h("div", { class: "grid" });
  app.append(grid);
  const src = card(grid, "Where the data comes from", { wide: true });
  src.body.append(h("dl", { class: "method" },
    h("dt", null, "PR data"), h("dd", null, META.mode === "api" ? `The ${META.provider} API. Open, review and merge times are exact.` : "Inferred from git history. A PR is a merge commit on the branch, or a squash commit whose subject ends in (#123) or whose body names a merge request. Open and review times do not exist in git."),
    h("dt", null, "Lines of code"), h("dd", null, `Net lines added minus deleted along the first-parent history of ${META.branch}, text files only. Paths matching these patterns are ignored: `, META.excludes.length ? META.excludes.map((e) => h("code", { style: "display:block" }, e)) : "none"),
    h("dt", null, "Direct commits"), h("dd", null, META.mode === "git" ? `${fmtInt(META.direct_commits)} commit(s) landed on the branch with no PR reference and are not counted as PRs.` : "Not applicable when PR data comes from the API."),
    h("dt", null, "Statistics"), h("dd", null, "Percentiles use linear interpolation between ranks. Standard deviation is the sample deviation. Bins in distributions are log-spaced when values span more than one order of magnitude."),
    h("dt", null, "Time zone"), h("dd", null, "Days, weeks (Monday start) and months are UTC.")));

  const dora = card(grid, "DORA definitions used", { wide: true });
  dora.body.append(h("dl", { class: "method" },
    h("dt", null, "Deployment"), h("dd", null, META.deploy_source === "tags" ? `A tag whose name matches ${TAG_DESC()}, dated by tag creation.` + (META.tag_default ? ` Pattern: ${META.tag_pattern}` : "") : "Every merge to the branch."),
    h("dt", null, "Lead time for changes"), h("dd", null, "First commit of the PR to the first release tag containing the merge. When no merged PR in the selected range has a release, it is measured to merge time instead; the same rule is used on every card. First commit time is the author date of the PR's first commit (the earliest branch commit when inferred from git), which a rebase can distort."),
    h("dt", null, "Change failure"), h("dd", null, `A merged PR that is a revert (title starts with Revert, or type revert) or matches the hotfix pattern /${META.failure_pattern}/i in its branch or labels, or ${META.failure_default ? "at the start of its title (after any type prefix)" : "in its title"}. The rate is failures divided by merged PRs.`),
    h("dt", null, "Time to restore"), h("dd", null, "For reverts whose message says \"This reverts commit <sha>\": time from the reverted change's merge to the revert's merge."),
    h("dt", null, "Performance bands"), h("dd", null, "Elite, High, Medium and Low use rounded thresholds from published DORA reports: frequency ≥ daily / ≥ weekly / ≥ monthly; lead time < 1 day / < 1 week / < 1 month; failure rate ≤ 5% / 10% / 15%; restore < 1 hour / < 1 day / < 1 week. DORA revises its definitions, so treat bands as rough.")));

  const rv = card(grid, "Review cycles", { wide: true, note: "API data only. Reviews by the author, by bots, still pending, or submitted after the merge are ignored." });
  rv.body.append(h("dl", { class: "method" },
    h("dt", null, "Cycle"), h("dd", null, "One round of review on one version of the PR. A PR approved on first look has 1 cycle; changes requested, a fix pushed and an approval make 2. Several reviewers on the same version are one cycle, and a push nobody reviewed before the merge adds none."),
    h("dt", null, "GitHub"), h("dd", null, "Each review names the head commit it was made against. A review of a different commit from the previous review starts a new cycle, so force-pushes and rebases count correctly."),
    h("dt", null, "GitLab"), h("dd", null, "From the merge request's notes: comments and approvals by other people are reviews, and \"added N commits\" system notes are pushes. A cycle is the reviews between two pushes. GitLab gives no changes-requested count."),
    h("dt", null, "Unreviewed"), h("dd", null, "Merged PRs with 0 cycles. Statistics are shown both without them (reviewed PRs only) and with them counted as 0, and their number is shown on its own."),
    h("dt", null, "Limits"), h("dd", null, `Counting stops at ${META.heuristics.review_cycle_cap} cycles, and GitHub returns at most 100 reviews per PR; such values are lower bounds.`)));

  const rk = card(grid, "Risk score rules", { wide: true, note: "Points add up and are capped at " + R.cap + ". Rules that need data the source lacks are skipped, never guessed." });
  const tiers = (arr, unit) => arr.map(([lim, pts], i) => `${i ? "> " + arr[i - 1][0] : "≤ " + lim}${lim != null && i ? " to " + lim : ""} ${unit}: ${pts}`).join("; ");
  rk.body.append(h("dl", { class: "method" },
    h("dt", null, "Size"), h("dd", null, "Lines changed. " + tiers(R.size_lines, "lines")),
    h("dt", null, "Files"), h("dd", null, "Files changed. " + tiers(R.files, "files")),
    h("dt", null, "Type"), h("dd", null, Object.entries(R.type).map(([k, v]) => `${k} ${v}`).join(", ")),
    h("dt", null, "Breaking change"), h("dd", null, `+${R.breaking} when the title has ! after the type or says BREAKING CHANGE.`),
    h("dt", null, "Sensitive paths"), h("dd", null, `+${R.sensitive_paths} when any changed path looks like migrations, auth, security, payments, infra, CI or container files. Needs the merge commit locally. `, h("details", null, h("summary", null, "Show the pattern"), h("code", null, "/" + META.heuristics.sensitive + "/i"))),
    h("dt", null, "No tests"), h("dd", null, `+${R.no_tests} when ${R.no_tests_min_code_lines}+ lines of non-test, non-doc source changed and no test file did.`),
    h("dt", null, "Unreviewed"), h("dd", null, `+${R.unreviewed} when merged with no review from anyone other than the author. API data only.`),
    h("dt", null, "Levels"), h("dd", null, R.levels.map(([lim, n], i) => `${n} ${lim == null ? "≥ " + R.levels[i - 1][0] : "< " + lim}`).join(", "))));
}

/* ------------------------------------------------------------------ page */
function renderFilters() {
  const f = $("#filters");
  f.replaceChildren();
  const preset = h("select", { id: "preset", "aria-label": "Date range" }, [["all", "All time"], ["12m", "Last 12 months"], ["6m", "Last 6 months"], ["3m", "Last 3 months"], ["1m", "Last month"], ["custom", "Custom range"]]
    .map(([v, l]) => h("option", { value: v, selected: v === state.preset }, l)));
  preset.addEventListener("change", () => { state.preset = preset.value; if (state.preset === "custom" && state.from == null) { state.from = DATA_LO; state.to = DATA_HI; } renderAll(); });
  f.append(h("label", null, "Range", preset));
  if (state.preset === "custom") {
    const mkDate = (key) => { const i = h("input", { type: "date", value: isoDate(state[key]), "aria-label": key }); i.addEventListener("change", () => { const t = Date.parse(i.value) / 1000; if (!isNaN(t)) { state[key] = t; renderAll(); } }); return i; };
    f.append(h("label", null, "From", mkDate("from")), h("label", null, "To", mkDate("to")));
  }
  const chips = h("div", { class: "chips", role: "group", "aria-label": "Types" });
  const present = new Set(PRS.map((p) => groupOf(p.type)));
  TYPE_GROUPS.filter((g) => present.has(g)).forEach((g) => {
    const b = h("button", { type: "button", "aria-pressed": String(state.types.has(g)), title: GROUP_NOTE[g] || g }, h("span", { class: "dot", style: "background:" + groupColor(g) }), g);
    b.addEventListener("click", () => { state.types.has(g) ? state.types.delete(g) : state.types.add(g); renderAll(); });
    chips.append(b);
  });
  f.append(h("label", null, "Types", chips));
  if (PRS.some((p) => p.bot)) {
    const cb = h("input", { type: "checkbox", checked: state.bots });
    cb.addEventListener("change", () => { state.bots = cb.checked; renderAll(); });
    f.append(h("label", null, cb, "Include bot PRs"));
  }
  const seg = h("span", { class: "seg", role: "group", "aria-label": "Period" }, ["day", "week", "month"].map((k) => {
    const b = h("button", { type: "button", "aria-pressed": String(state.period === k) }, k[0].toUpperCase() + k.slice(1));
    b.addEventListener("click", () => { state.period = k; try { localStorage.setItem("repo-stats-period", k); } catch (e) { /* ignore */ } renderAll(); });
    return b;
  }));
  f.append(h("label", null, "Period", seg));
  const isDark = document.documentElement.dataset.theme !== "light";
  const theme = h("button", { type: "button", "aria-pressed": String(isDark), title: "Switch between dark and light theme" }, isDark ? "Dark theme" : "Light theme");
  theme.addEventListener("click", () => {
    const next = isDark ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("repo-stats-theme", next); } catch (e) { /* storage may be blocked */ }
    renderAll();
  });
  f.append(theme);
}
function renderBanner() {
  const b = $("#banner");
  b.replaceChildren();
  const api = META.mode === "api";
  const box = h("div", { class: "banner" + (api ? " ok" : "") },
    h("strong", null, api ? `Exact PR data from the ${META.provider} API.` : "PR data is inferred from git history."),
    " ", api ? "Open, review and merge times are real." : "Open and review times are missing, first-commit times are approximate, and PRs that left no trace in git are absent. Install and log in to gh or glab for accurate results.");
  if (META.warnings.length) box.append(h("ul", null, META.warnings.map((w) => h("li", null, w))));
  b.append(box);
}
function renderAll() {
  hideTip();
  const y = scrollY;
  renderFilters();
  const app = $("#app");
  app.replaceChildren();
  const sel = selection();
  if (!sel.merged.length && !PRS.length) app.append(h("div", { class: "banner" }, "No pull requests were found. Lines of code still render below."));
  renderKpis(app, sel);
  renderLoc(app, sel);
  renderThroughput(app, sel);
  renderSize(app, sel);
  renderTypes(app, sel);
  renderRisk(app, sel);
  renderTime(app, sel);
  renderReviews(app, sel);
  renderDora(app, sel);
  renderMethod(app);
  scrollTo(0, y);
}
document.title = "Repo stats – " + META.name;
$("#title").textContent = META.name;
$("#subtitle").textContent = `Branch ${META.branch} · ${fmtInt(META.commits)} commits · ${fmtDate(DATA_LO)} to ${fmtDate(DATA_HI)} · generated ${fmtDate(META.generated)}`;
renderBanner();
renderAll();
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderAll, 200); });
window.__repoStats = { stats, percentile, bucketStart, countBuckets, band, cycleSplit };
</script>
</body>
